<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e0b"/>
      <stop offset="50%" stop-color="#101713"/>
      <stop offset="100%" stop-color="#16201b"/>
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="400" cy="180" r="120" fill="rgba(16, 185, 129, 0.08)" filter="blur(30px)"/>
  
  <!-- Outer card border -->
  <rect x="20" y="20" width="760" height="410" rx="16" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>
  
  <!-- Center Icon badge -->
  <circle cx="400" cy="180" r="54" fill="rgba(16, 23, 19, 0.9)" stroke="url(#emGrad)" stroke-width="2"/>
  <text x="400" y="192" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="34" text-anchor="middle" fill="#34d399">💻</text>
  
  <!-- Category tag -->
  <rect x="300" y="260" width="200" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <text x="400" y="279" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#34d399" letter-spacing="1">WEB DEVELOPMENT</text>
  
  <!-- Title -->
  <text x="400" y="325" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#f1f5f3">Minimal Green Web App</text>
  <text x="400" y="355" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#94a39a">Project Preview &amp; Case Study</text>
</svg>