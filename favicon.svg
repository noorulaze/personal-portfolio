<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090e0b"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="22" fill="#101713" stroke="url(#emeraldGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="32" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f1f5f3" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="#34d399">N</tspan><tspan fill="#ffffff">A</tspan>
  </text>
  <circle cx="44" cy="20" r="3" fill="#10b981"/>
</svg>
